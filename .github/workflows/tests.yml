name: Test

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "test-requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "test-requirements.txt"
      - ".github/workflows/tests.yml"
  schedule:
    # Weekly real-browser integration check; kept off PRs because external
    # Cloudflare behavior is inherently network-dependent.
    - cron: "31 8 * * 0"
  workflow_dispatch:
    inputs:
      docker_smoke:
        description: Build and smoke-test only the native Docker image
        type: boolean
        default: false

permissions: {}

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-api:
    if: github.event_name != 'workflow_dispatch' || !inputs.docker_smoke
    name: Local API smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.1"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r test-requirements.txt

      - name: Run browser-free API tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests -p "test_*.py" -v

  external-browser:
    name: External browser integration
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.docker_smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.1"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt

      - name: Install integration-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r test-requirements.txt

      - name: Run selected real-browser tests
        working-directory: src
        env:
          HEADLESS: "true"
          LOG_LEVEL: info
        run: |
          python -m unittest -v tests.TestFlareSolverr.test_v1_endpoint_request_get_no_cloudflare
          python - <<'PY'
          from dtos import STATUS_OK, V1ResponseBase
          from tests import TestFlareSolverr, _find_obj_by_key

          res = TestFlareSolverr.app.post_json('/v1', {
              "cmd": "request.get",
              "url": TestFlareSolverr.cloudflare_url,
          })
          assert res.status_code == 200

          body = V1ResponseBase(res.json)
          assert body.status == STATUS_OK
          assert body.message in ("Challenge solved!", "Challenge not detected!"), body.message
          assert body.startTimestamp > 10000
          assert body.endTimestamp >= body.startTimestamp

          solution = body.solution
          assert TestFlareSolverr.cloudflare_url in solution.url
          assert solution.status == 200
          assert "NOWSECURE" in solution.response.upper()
          assert "Chrome/" in solution.userAgent

          if body.message == "Challenge solved!":
              cf_cookie = _find_obj_by_key("name", "cf_clearance", solution.cookies)
              assert cf_cookie is not None, "Cloudflare cookie not found"
              assert len(cf_cookie["value"]) > 30
          PY

  docker-smoke:
    name: Docker Chromium smoke
    if: github.event_name == 'workflow_dispatch' && inputs.docker_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native image
        run: docker build --pull -t flaresolverr:smoke .
      - name: Exercise Python, Chromium and the local API
        run: |
          docker run -d --name flaresolverr-smoke -p 127.0.0.1:8191:8191 flaresolverr:smoke
          docker exec flaresolverr-smoke python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
          docker exec flaresolverr-smoke python -c 'from pathlib import Path; p = Path("/tmp/fixture"); p.mkdir(); (p / "index.html").write_text("<html><body>docker-browser-smoke</body></html>")'
          docker exec -d flaresolverr-smoke python -m http.server 8080 --bind 127.0.0.1 --directory /tmp/fixture
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8191/", timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  if attempt == 59:
                      raise
                  time.sleep(1)
          request = urllib.request.Request(
              "http://127.0.0.1:8191/v1",
              data=json.dumps({"cmd": "request.get", "url": "http://127.0.0.1:8080/", "maxTimeout": 60000}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              result = json.load(response)
          assert result["status"] == "ok", result
          assert result["solution"]["status"] == 200, result
          assert "docker-browser-smoke" in result["solution"]["response"], result
          assert "Chrome/" in result["solution"]["userAgent"], result
          print("DOCKER_CHROMIUM_SMOKE_OK")
          PY
      - name: Container logs
        if: always()
        run: docker logs flaresolverr-smoke 2>&1 || true
      - name: Remove test container
        if: always()
        run: docker rm -f flaresolverr-smoke 2>/dev/null || true
