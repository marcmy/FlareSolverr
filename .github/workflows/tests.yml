name: Test

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "test-requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "test-requirements.txt"
      - ".github/workflows/tests.yml"
  schedule:
    # Weekly real-browser integration check; kept off PRs because external
    # Cloudflare behavior is inherently network-dependent.
    - cron: "31 8 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-api:
    name: Local API smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r test-requirements.txt

      - name: Run browser-free API tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests -p "test_*.py" -v

  external-browser:
    name: External browser integration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt

      - name: Install integration-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r test-requirements.txt

      - name: Run selected real-browser tests
        working-directory: src
        env:
          HEADLESS: "true"
          LOG_LEVEL: info
        run: >-
          python -m unittest -v
          tests.TestFlareSolverr.test_v1_endpoint_request_get_no_cloudflare
          tests.TestFlareSolverr.test_v1_endpoint_request_get_cloudflare_js_1
