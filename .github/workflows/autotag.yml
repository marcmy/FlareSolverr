name: Autotag

on:
  push:
    branches:
      - "master"

jobs:
  tag-release:
    # Upstream release automation depends on FlareSolverr/FlareSolverr's GH_PAT.
    # Keep the workflow in sync with upstream, but do not run it in this fork.
    if: github.repository == 'FlareSolverr/FlareSolverr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Auto tag
        uses: Klemensas/action-autotag@stable
        with:
          GITHUB_TOKEN: "${{ secrets.GH_PAT }}"
          tag_prefix: "v"
